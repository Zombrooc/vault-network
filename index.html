<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f5f7f3" />
    <meta name="description" content="Vault Network — seus arquivos, seu controle, sua rede." />
    <title>Vault Network</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="app-shell">
      <aside class="sidebar" aria-label="Navegação principal">
        <div class="brand">
          <div class="brand-mark" aria-hidden="true"><span></span><span></span><span></span></div>
          <div>
            <strong>vault</strong><span>network</span>
          </div>
        </div>

        <div class="workspace-picker">
          <div class="avatar avatar-purple">JD</div>
          <div class="workspace-copy"><strong>João Duarte</strong><span>Espaço pessoal</span></div>
          <button class="icon-button small" aria-label="Trocar espaço"><svg viewBox="0 0 24 24"><path d="m7 10 5 5 5-5"/></svg></button>
        </div>

        <nav class="primary-nav">
          <p class="nav-label">Workspace</p>
          <button class="nav-item active" data-view="home"><svg viewBox="0 0 24 24"><path d="m4 10 8-6 8 6v9a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1z"/><path d="M9 20v-6h6v6"/></svg><span>Início</span></button>
          <button class="nav-item" data-view="containers"><svg viewBox="0 0 24 24"><path d="M4 7.5 12 4l8 3.5v9L12 20l-8-3.5z"/><path d="M4.5 7.5 12 11l7.5-3.5M12 11v9"/></svg><span>Meus containers</span><em>3</em></button>
          <button class="nav-item" data-view="shares"><svg viewBox="0 0 24 24"><circle cx="18" cy="5" r="2.5"/><circle cx="6" cy="12" r="2.5"/><circle cx="18" cy="19" r="2.5"/><path d="m8.2 10.8 7.6-4.5M8.2 13.2l7.6 4.5"/></svg><span>Compartilhamentos</span></button>
          <button class="nav-item" data-view="transfers"><svg viewBox="0 0 24 24"><path d="M7 3v14M7 17l-3-3M7 17l3-3M17 21V7M17 7l-3 3M17 7l3 3"/></svg><span>Transferências</span></button>
          <p class="nav-label nav-label-spaced">Sistema</p>
          <button class="nav-item" data-view="settings"><svg viewBox="0 0 24 24"><path d="M12 15.2a3.2 3.2 0 1 0 0-6.4 3.2 3.2 0 0 0 0 6.4Z"/><path d="m19.4 15 .1.1a1.8 1.8 0 0 1-2.5 2.5l-.1-.1a1.8 1.8 0 0 0-3.1 1.3v.2a1.8 1.8 0 0 1-3.6 0v-.2a1.8 1.8 0 0 0-3.1-1.3l-.1.1a1.8 1.8 0 0 1-2.5-2.5l.1-.1A1.8 1.8 0 0 0 3.4 12a1.8 1.8 0 0 1 0-3.6h.2a1.8 1.8 0 0 0 1.3-3.1l-.1-.1a1.8 1.8 0 0 1 2.5-2.5l.1.1a1.8 1.8 0 0 0 3.1-1.3v-.2a1.8 1.8 0 0 1 3.6 0v.2a1.8 1.8 0 0 0 3.1 1.3l.1-.1a1.8 1.8 0 0 1 2.5 2.5l-.1.1A1.8 1.8 0 0 0 21 8.4h.2a1.8 1.8 0 0 1 0 3.6H21a1.8 1.8 0 0 0-1.6 3Z"/></svg><span>Configurações</span></button>
        </nav>

        <div class="sidebar-footer">
          <div class="relay-status"><span class="status-dot offline"></span><div><strong>Modo local</strong><span>Relay não configurado</span></div><button class="icon-button small" aria-label="Mais informações"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 11v5M12 8h.01"/></svg></button></div>
          <button class="help-link"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M9.8 9a2.3 2.3 0 1 1 3.9 1.7c-1.1 1-1.7 1.3-1.7 2.8M12 17h.01"/></svg>Central de ajuda</button>
        </div>
      </aside>

      <main class="main-content">
        <header class="topbar">
          <div class="breadcrumb"><span id="breadcrumb-section">Início</span><svg viewBox="0 0 24 24"><path d="m9 18 6-6-6-6"/></svg><strong id="breadcrumb-current">Visão geral</strong></div>
          <div class="topbar-actions">
            <button class="icon-button notification-button" aria-label="Notificações"><svg viewBox="0 0 24 24"><path d="M18 9a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9M10 21h4"/></svg><span></span></button>
            <button class="user-menu"><span class="avatar avatar-purple">JD</span><span class="user-menu-copy"><strong>João Duarte</strong><small>Plano pessoal</small></span><svg viewBox="0 0 24 24"><path d="m7 10 5 5 5-5"/></svg></button>
          </div>
        </header>

        <div id="app-view" class="content-wrap"></div>
      </main>
    </div>

    <div class="modal-backdrop" id="modal-backdrop" hidden>
      <section class="modal" id="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title"></section>
    </div>
    <div class="toast-region" aria-live="polite" aria-atomic="true"></div>
    <input type="file" id="file-picker" multiple hidden />
    <script src="app.js"></script>
  </body>
</html>
