[package]
name = "vault-sharing"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Signed, HPKE-encrypted invitations for Vault Network"

[dependencies]
ed25519-dalek = "2"
hpke = { version = "0.14", default-features = false, features = ["alloc", "getrandom", "x25519", "chacha", "hkdfsha2"] }
thiserror = "1"
vault-identity = { path = "../vault-identity" }
vault-protocol = { path = "../vault-protocol" }
zeroize = "1.8"
